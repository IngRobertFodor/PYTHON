<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot - Centrum uzdravenia</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px; background: transparent; overflow: hidden;
}
:root {
  --c-green:      #007848;
  --c-green-dark: #005e37;
  --c-green-h:    #005e37;
  --c-cream:      #F7F1E7;
  --c-cream-soft: #FBF6EE;
  --c-border:     #D6CBBA;
  --c-user-bg:    #DCE8DC;
  --c-user-fg:    #1a3a1a;
  --c-bot-bg:     #ECEBE3;
  --c-bot-fg:     #22403A;
  --c-text:       #22403A;
  --c-muted:      #7A8C80;
  --c-shadow:     rgba(30,70,45,.17);
  --radius-lg:    18px;
  --radius-md:    14px;
}
#cz-root {
  position: relative; width: 100%; height: 100%;
}

/* === FAB === */
#cz-fab {
  position: absolute; bottom: 12px; right: 12px;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--c-green); border: none; cursor: pointer;
  box-shadow: 0 4px 18px var(--c-shadow);
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .2s, box-shadow .2s;
  z-index: 100;
  animation: czPulse 2.8s ease-in-out 1.2s 2;
}
@keyframes czPulse {
  0%,100% { box-shadow: 0 4px 18px var(--c-shadow); }
  50%      { box-shadow: 0 4px 26px rgba(46,125,80,.5), 0 0 0 8px rgba(46,125,80,.12); }
}
#cz-fab:hover  { background: var(--c-green-h); transform: scale(1.07); }
#cz-fab:focus-visible { outline: 3px solid var(--c-green-h); outline-offset: 2px; }
#cz-fab .cz-icon { width: 28px; height: 28px; fill: #fff; }
#cz-fab .cz-fab-close  { display: none; }
#cz-fab.is-open .cz-fab-chat  { display: none; }
#cz-fab.is-open .cz-fab-close { display: block; }
/* === WINDOW === */
/* Zakladny rezim – vyplni cely ramcek (vsetky zariadenia) */
#cz-window {
  position: absolute;
  left: 8px; right: 8px; top: 8px; bottom: 76px;
  background: var(--c-cream);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 36px var(--c-shadow);
  display: none; flex-direction: column; overflow: hidden; z-index: 90;
  opacity: 0; transform: translateY(10px);
  transition: opacity .24s ease, transform .24s ease;
}
#cz-window.is-open { opacity: 1; transform: translateY(0); }
/* === HEADER === */
#cz-header {
  background: #007848;
  flex-shrink: 0; overflow: hidden;
}
#cz-header-logo {
  display: block; width: 100%; height: 101px;
  object-fit: contain; object-position: left center;
}

/* === MESSAGES === */
#cz-messages {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 12px;
  display: flex; flex-direction: column; gap: 8px;
  scroll-behavior: smooth;
  position: relative;
}
#cz-messages::-webkit-scrollbar { width: 4px; }
#cz-messages::-webkit-scrollbar-track { background: transparent; }
#cz-messages::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 4px; }

  background-position: center center;
}
.cz-msg {
  max-width: 88%; padding: 9px 13px;
  border-radius: var(--radius-md);
  font-size: 13.5px; line-height: 1.58; word-break: break-word;
  animation: czIn .18s ease; position: relative; z-index: 1;
}
@keyframes czIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.cz-msg-bot  { align-self: flex-start; background: var(--c-bot-bg);  color: var(--c-bot-fg); border-bottom-left-radius: 4px; }
.cz-msg-user { align-self: flex-end;   background: var(--c-user-bg); color: var(--c-user-fg); border-bottom-right-radius: 4px; }
.cz-line   { display: block; }
.cz-line + .cz-line { margin-top: 2px; }
.cz-bullet { display: block; padding-left: 15px; position: relative; margin-top: 3px; }
.cz-bullet::before { content: "\2022"; position: absolute; left: 4px; color: var(--c-green); }
a.cz-link { color: var(--c-green); text-decoration: underline; word-break: break-all; }
a.cz-link:hover { color: var(--c-green-h); }
/* Typing indicator */
.cz-typing { align-self: flex-start; display: flex; align-items: center; gap: 4px; padding: 9px 14px;
  background: var(--c-bot-bg); border-radius: var(--radius-md); border-bottom-left-radius: 4px; animation: czIn .18s ease; }
.cz-typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--c-muted); display: block; animation: czDot .9s ease-in-out infinite; }
.cz-typing span:nth-child(2) { animation-delay: .18s; }
.cz-typing span:nth-child(3) { animation-delay: .36s; }
@keyframes czDot { 0%,60%,100% { transform:translateY(0); opacity:.45; } 30% { transform:translateY(-5px); opacity:1; } }
/* === QUICK BUTTONS === */
#cz-quickbtns {
  padding: 6px 10px 7px; display: flex; flex-wrap: wrap; gap: 5px;
  border-top: 1px solid var(--c-border); background: var(--c-cream-soft); flex-shrink: 0;
}
.cz-qbtn {
  font-size: 11.5px; padding: 4px 11px; border-radius: 20px;
  border: 1.5px solid var(--c-green); background: transparent; color: var(--c-green);
  cursor: pointer; font-family: inherit; white-space: nowrap;
  transition: background .15s, color .15s, transform .12s;
}
.cz-qbtn:hover { background: var(--c-green); color: #fff; transform: translateY(-1px); }
.cz-qbtn:focus-visible { outline: 2px solid var(--c-green-h); outline-offset: 1px; }
/* === INPUT BAR === */
#cz-inputbar {
  padding: 8px 10px; border-top: 1px solid var(--c-border);
  background: var(--c-cream-soft); display: flex; gap: 7px; align-items: center; flex-shrink: 0;
}
#cz-input {
  flex: 1; border: 1.5px solid var(--c-border); border-radius: 22px;
  padding: 7px 14px; font-size: 13.5px; font-family: inherit;
  color: var(--c-text); background: #fff; outline: none; transition: border-color .15s;
}
#cz-input:focus { border-color: var(--c-green); }
#cz-input::placeholder { color: var(--c-muted); }
#cz-send {
  width: 37px; height: 37px; border-radius: 50%;
  border: none; background: var(--c-green); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .15s, transform .15s;
}
#cz-send:hover { background: var(--c-green-h); transform: scale(1.07); }
#cz-send:focus-visible { outline: 2px solid var(--c-green-h); outline-offset: 2px; }
#cz-send svg { width: 16px; height: 16px; fill: #fff; }

/* ── KOMPAKTNY REZIM 1 (< 520px vyska) ─────────────────────────── */
@media (max-height: 520px) {
  #cz-header-logo { height: 62px; }
  #cz-quickbtns   { padding: 4px 8px 5px; gap: 4px; }
  .cz-qbtn        { font-size: 10.5px; padding: 3px 9px; }
  #cz-inputbar    { padding: 5px 8px; }
  #cz-send        { width: 32px; height: 32px; }
  .cz-msg         { padding: 7px 11px; font-size: 13px; line-height: 1.5; }
  .cz-wl-2, .cz-wl-br-2 { display: none; }
}
/* ── KOMPAKTNY REZIM 2 (< 380px vyska) ─────────────────────────── */
@media (max-height: 380px) {
  #cz-header-logo { height: 48px; }
  #cz-quickbtns {
    padding: 3px 6px 4px; gap: 3px;
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #cz-quickbtns::-webkit-scrollbar { display: none; }
  .cz-qbtn     { font-size: 10px; padding: 2px 8px; flex-shrink: 0; }
  #cz-inputbar { padding: 4px 7px; }
  #cz-send     { width: 30px; height: 30px; }
  .cz-msg      { padding: 5px 9px; font-size: 12.5px; line-height: 1.45; }
  .cz-wl-2, .cz-wl-br-2,
  .cz-wl-3, .cz-wl-br-3 { display: none; }
}
/* ── KOMPAKTNY REZIM 3 (< 340px vyska) ─────────────────────────── */
@media (max-height: 340px) {
  #cz-header-logo { height: 40px; }
  #cz-messages    { padding: 6px 8px; gap: 5px; }
  #cz-quickbtns {
    padding: 2px 5px 3px; gap: 3px;
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #cz-quickbtns::-webkit-scrollbar { display: none; }
  .cz-qbtn     { font-size: 9.5px; padding: 2px 7px; flex-shrink: 0; }
  #cz-inputbar { padding: 3px 6px; }
  #cz-send     { width: 28px; height: 28px; }
  #cz-input    { padding: 5px 10px; font-size: 13px; }
  .cz-msg      { padding: 4px 8px; font-size: 12px; line-height: 1.4; }
  .cz-wl-2, .cz-wl-br-2,
  .cz-wl-3, .cz-wl-br-3 { display: none; }
}
/* ── KOMPAKTNY REZIM 4 (< 260px vyska) ─────────────────────────── */
@media (max-height: 260px) {
  #cz-header-logo { height: 36px; }
  #cz-messages    { padding: 4px 6px; gap: 4px; }
  #cz-quickbtns {
    padding: 2px 4px; gap: 2px;
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #cz-quickbtns::-webkit-scrollbar { display: none; }
  .cz-qbtn     { font-size: 9px; padding: 1px 6px; flex-shrink: 0; }
  #cz-inputbar { padding: 2px 5px; }
  #cz-send     { width: 26px; height: 26px; }
  #cz-input    { padding: 4px 8px; font-size: 12px; }
  .cz-msg      { padding: 3px 7px; font-size: 11.5px; line-height: 1.35; }
  .cz-wl-2, .cz-wl-br-2,
  .cz-wl-3, .cz-wl-br-3 { display: none; }
}
</style>
</head>

const WELCOME_LINES = [
  "Vitajte v Centre uzdravenia. Rád Vám poradím so základnými informáciami: hodiny, adresa, objednanie, ceník alebo naše služby.",
  "Osobné a zdravotné témy prosím riešte priamo s naším tímom telefonicky alebo e-mailom.",

];

  { label:"Ordinačné hodiny", query:"ordinacne hodiny" },
  { label:"Adresa",           query:"adresa kde" },

];

function normalize(s) {
  return s.toLowerCase()
    .replace(/[áä]/g,"a").replace(/[č]/g,"c").replace(/[ď]/g,"d")
    .replace(/[éě]/g,"e").replace(/[í]/g,"i")
    .replace(/[ľĺ]/g,"l").replace(/[ňń]/g,"n")
    .replace(/[óô]/g,"o").replace(/[ŕř]/g,"r")
    .replace(/[šś]/g,"s").replace(/[ť]/g,"t")
    .replace(/[úů]/g,"u").replace(/[ý]/g,"y")
    .replace(/[žźż]/g,"z");
}
function scoreItem(item, n) {
  var s=0;
  for(var i=0;i<item.keywords.length;i++) if(n.indexOf(normalize(item.keywords[i]))!==-1) s++;
  return s;
}
function findAnswer(text) {
  var n=normalize(text.trim()), best=0, found=null;
  if(!n) return null;
  for(var i=0;i<FAQ.length;i++){var s=scoreItem(FAQ[i],n);if(s>best){best=s;found=FAQ[i];}}
  return best>0?found:null;
}

function makeLink(l) {
  var a=document.createElement("a");
  a.className="cz-link"; a.href=l.href; a.textContent=l.label;
  return a;
}

function appendMsg(role,content,links) {
  var msgs=document.getElementById("cz-messages");
  var d=document.createElement("div");
  d.className="cz-msg cz-msg-"+role;
  if(Array.isArray(content)){
    for(var i=0;i<content.length;i++){
      var sp=document.createElement("span");
      sp.className=(i===0)?"cz-line":"cz-bullet";
      sp.textContent=content[i];
      d.appendChild(sp);
    }
  } else {
    var parts=content.split("\n");
    for(var j=0;j<parts.length;j++){
      if(j>0) d.appendChild(document.createElement("br"));
      d.appendChild(document.createTextNode(parts[j]));
    }
  }
  if(links && links.length){
    var ld=document.createElement("span");
    ld.style.cssText="display:block;margin-top:6px;"; 
    links.forEach(function(l,i){
      if(i>0){var sep=document.createElement("span");sep.textContent=" \u00b7 ";ld.appendChild(sep);}
      ld.appendChild(makeLink(l));
    });
    d.appendChild(ld);
  }
  msgs.insertBefore(d, document.getElementById("cz-msg-bg"));
  msgs.scrollTop=msgs.scrollHeight;
}

function showTyping(){
  var msgs=document.getElementById("cz-messages");
  var t=document.createElement("div");
  t.className="cz-typing"; t.id="cz-typing";
  t.innerHTML="<span></span><span></span><span></span>";
  msgs.insertBefore(t, document.getElementById("cz-msg-bg"));
  msgs.scrollTop=msgs.scrollHeight;
  return t;
}

function processQuery(text){
  if(!text.trim()) return;
  appendMsg("user",text);
  var t=showTyping();
  setTimeout(function(){
    if(t.parentNode) t.parentNode.removeChild(t);
    var item=findAnswer(text);
    if(!item){ appendMsg("bot",FALLBACK,FALLBACK_LINKS); }
    else if(item.lines){ appendMsg("bot",item.lines,item.links); }
    else { appendMsg("bot",item.answer,item.links); }
  },420);
}

function init(){
  var fab=document.getElementById("cz-fab");
  var win=document.getElementById("cz-window");
  var inp=document.getElementById("cz-input");
  var send=document.getElementById("cz-send");
  var qbtns=document.getElementById("cz-quickbtns");
  var msgs=document.getElementById("cz-messages");

  // Welcome message
  var wd=document.createElement("div");
  wd.className="cz-msg cz-msg-bot";
  for(var i=0;i<WELCOME_LINES.length;i++){
    if(i>0){var br=document.createElement("br");br.className="cz-wl-br cz-wl-br-"+(i+1);wd.appendChild(br);}
    var sp=document.createElement("span");
    sp.className="cz-wl cz-wl-"+(i+1);
    sp.appendChild(document.createTextNode(WELCOME_LINES[i]));
    wd.appendChild(sp);
  }
  msgs.insertBefore(wd,document.getElementById("cz-msg-bg"));

  // Quick buttons
  for(var qi=0;qi<QUICK_BTNS.length;qi++){
    (function(btn){
      var b=document.createElement("button");
      b.className="cz-qbtn"; b.type="button"; b.textContent=btn.label;
      b.addEventListener("click",function(){processQuery(btn.query);inp.focus();});
      qbtns.appendChild(b);
    })(QUICK_BTNS[qi]);
  }

  // FAB toggle
  fab.addEventListener("click",function(){
    var isOpen=win.classList.contains("is-open");
    if(isOpen){
      win.classList.remove("is-open");
      setTimeout(function(){win.style.display="none";},250);
      fab.classList.remove("is-open");
      fab.setAttribute("aria-expanded","false");
    } else {
      win.style.display="flex";
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){win.classList.add("is-open");});
      });
      fab.classList.add("is-open");
      fab.setAttribute("aria-expanded","true");
      setTimeout(function(){inp.focus();msgs.scrollTop=msgs.scrollHeight;},60);
    }
  });

  send.addEventListener("click",function(){
    var t=inp.value; inp.value=""; processQuery(t); inp.focus();
  });

  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){
      e.preventDefault();
      var t=inp.value; inp.value=""; processQuery(t);
    }
  });
}

document.addEventListener("DOMContentLoaded",init);
</script>
